name: CI

# Runs on every push and pull request to any branch.
# Required status checks "typecheck" and "build" must pass before merging to staging or main.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

  build:
    name: build
    runs-on: ubuntu-latest
    # Stub env vars so Vite does not throw on missing VITE_SUPABASE_* during CI.
    # The real values are injected by Vercel at deployment time; these stubs
    # only need to satisfy the build-time type guards.
    env:
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder
      VITE_APP_ENV: staging
      VITE_APP_VERSION: ${{ github.sha }}
      VITE_ENABLE_AI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (staging mode)
        run: npm run build:staging
