# GitHub Repository Branch Protection Rules
# Applied automatically by the "settings" GitHub App (https://github.com/repository-settings/app)
# if installed. Otherwise, apply these manually in GitHub → Settings → Branches.
#
# Manual setup instructions are in DEPLOYMENT.md → "Branch Protection Setup".

repository:
  # Prevent force-pushes and accidental deletion on all protected branches.
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  delete_branch_on_merge: true

branches:
  - name: main
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
        require_code_owner_reviews: false
      required_status_checks:
        strict: true          # Branch must be up-to-date with main before merge
        contexts:
          - "typecheck"       # Must pass — defined in ci.yml
          - "build"           # Must pass — defined in ci.yml
      enforce_admins: true    # Rules apply to repo owners too — no bypassing
      restrictions: null      # Any team member may open a PR; approval gates the merge
      allow_force_pushes: false
      allow_deletions: false

  - name: staging
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
      required_status_checks:
        strict: true
        contexts:
          - "typecheck"
          - "build"
      enforce_admins: false   # Admins may push hotfixes to staging directly if needed
      allow_force_pushes: false
      allow_deletions: false

  - name: develop
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 0  # Self-merge allowed on develop
      required_status_checks:
        strict: false
        contexts:
          - "typecheck"
          - "build"
      enforce_admins: false
      allow_force_pushes: false
      allow_deletions: false
